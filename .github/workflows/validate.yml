name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: |
          python3 -m py_compile skills/lucid/scripts/lucid.py
          python3 -m py_compile scripts/validate-skill.py
          python3 -m py_compile scripts/validate-evals.py
          python3 -m py_compile scripts/validate-no-dangerous-io.py

      - name: Validate skill structure
        run: python3 scripts/validate-skill.py

      - name: Validate safety constraints
        run: python3 scripts/validate-no-dangerous-io.py

      - name: Validate eval fixtures
        run: python3 scripts/validate-evals.py

      - name: Self audit
        run: |
          python3 skills/lucid/scripts/lucid.py scan --root . --format json
          python3 skills/lucid/scripts/lucid.py audit --root . --format json --out .lucid/audit.json
          python3 skills/lucid/scripts/lucid.py plan --root . --audit .lucid/audit.json --out .lucid/plan.md
          python3 skills/lucid/scripts/lucid.py verify --root . --strict

